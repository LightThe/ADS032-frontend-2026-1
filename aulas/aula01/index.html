<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/lerne.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aluno Olaine</title>
</head>

<body>
  <!--main>(img+h1+(label+input)*2+button)-->
  <main>
    <img src="/lerne.svg" alt="Icone de chapeu de formatura">
    <h1>Aluno Olaine</h1>
    <label for="matricula">Matricula</label>
    <input type="number" id="matricula" name="matricula">
    <p id="matricula-erro"></p>
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha">
    <p id="senha-erro"></p>
    <button type="submit">Entrar</button>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
